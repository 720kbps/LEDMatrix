<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>LED Matrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>

<body>
    <div id="main-container">
        <h1 id="main-header">LED MATRIX CONTROL</h1>
        <div id="matrix-controls">
            <div id="matrix-wrapper">
                <table id="main-table" class="table table-bordered table-hover" style="margin: 20px auto;">
                    <tbody id="matrix-body"></tbody>
                </table>
            </div>
            <div id="slider-wrapper">
                <div id="brightness-value">25</div>
                <input id="brightness-slider" type="range" min="0" max="100" value="25" step="1" orient="vertical">
                <div id="brightness-label">Brightness</div>
            </div>
        </div>
        <button id="clear-button" class="btn btn-danger" type="button">Clear</button>
        <form id="upload-form" action="{% url 'upload_image' %}" method="post" enctype="multipart/form-data" class="mt-3">
            {% csrf_token %}
            <div class="input-group">
                <input class="form-control" type="file" name="image" id="upload-input" accept="image/*" required>
                <button class="btn btn-primary" type="submit">Upload Picture</button>
            </div>
        </form>
        {% if error %}
            <div class="text-danger mt-2">{{ error }}</div>
        {% endif %}
        <div class="gallery mt-4">
            <div class="gallery-title">Latest uploads</div>
            <div class="gallery-row">
                {% for url in gallery_images %}
                    <img src="{{ url }}" alt="Upload {{ forloop.counter }}" class="gallery-thumb">
                {% empty %}
                    <div class="text-muted">No uploads yet.</div>
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="{% static "scripts/script.js" %}"></script>
</body>
</html>
